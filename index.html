<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ちいかわ予定帳</title>
<style>
  :root {
    --bg: #fff8f3; --card: #ffffff; --ink: #4a3b36; --sub: #8a7a73; --line: #f0e2da;
    --pink: #f29bb0; --pink-soft: #fde6ec; --blue: #7cb7e8; --blue-soft: #e4f1fb;
    --green: #8cc9a0; --green-soft: #e5f4ea; --gray-soft: #f1ece9; --past: #d6cfcb; --past-ink: #5f534e; --warn: #e2725b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #221c1a; --card: #2e2624; --ink: #f3e9e4; --sub: #b8a9a2; --line: #433834;
      --pink-soft: #4a2c35; --blue-soft: #233a4d; --green-soft: #26402f; --gray-soft: #3a312e; --past: #171211; --past-ink: #a3958f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 22px; margin: 0; display: flex; align-items: center; gap: 8px; }
  h1 .add { margin-left: auto; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 80px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 14px; overflow: hidden; }
  .card.past { background: var(--past); border-color: transparent; }
  .card.past .imgs { filter: grayscale(.9) brightness(.8); opacity: .75; }
  .card.past { color: var(--past-ink); } .card.past .title, .card.past .big { color: var(--past-ink); }
  .badge.end { background: #6f6460; color: #fff; }
  .imgs { display: flex; gap: 6px; overflow-x: auto; background: var(--gray-soft); }
  .imgs img { height: 180px; max-width: 100%; object-fit: cover; cursor: zoom-in; flex: 0 0 auto; }
  .imgs img:only-child { width: 100%; height: auto; max-height: 280px; }
  .body { padding: 12px 14px 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--gray-soft); }
  .badge.new { background: var(--pink); color: #fff; font-weight: bold; }
  .badge.lottery { background: var(--blue-soft); }
  .badge.first { background: var(--pink-soft); }
  .badge.done { background: #3f9a5e; color: #fff; font-weight: bold; }
  /* 開催中はオレンジの塗り、開催前は青の枠 */
  .hold { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; font-weight: bold; }
  .hold b { font-size: 14px; padding: 3px 12px; border-radius: 999px; border: 2px solid; }
  .hold.now b { background: #e8590c; border-color: #e8590c; color: #fff; }
  .hold.now span { color: #e8590c; }
  .hold.pre b { border-color: #3b7dd8; color: #3b7dd8; background: transparent; }
  .hold.pre span { color: #3b7dd8; }
  /* 応募済みはひと目でわかるように：緑の枠と上の帯 */
  .card.applied { border: 3px solid #3f9a5e; }
  .appliedbar { background: #3f9a5e; color: #fff; font-weight: bold; font-size: 15px; text-align: center; padding: 6px; letter-spacing: .1em; }
  .card.past .appliedbar { background: #6f8a76; }
  .title { font-size: 21px; font-weight: bold; margin: 14px 0 10px; line-height: 1.45; }
  .when { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 14px; margin-bottom: 8px; align-items: baseline; }
  .when dt { color: var(--sub); }
  .when dd { margin: 0; }
  .big { font-size: 18px; font-weight: bold; }
  .left { color: var(--warn); font-weight: bold; margin-left: 6px; font-size: 13px; }
  .detail { font-size: 13px; color: var(--sub); white-space: pre-wrap; line-height: 1.6; margin: 0 0 8px; }
  .links { margin: 18px 0; }
  .links a { display: block; font-size: 14px; color: var(--blue); word-break: break-all; margin: 8px 0; text-decoration: none; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  button, .btn { font: inherit; font-size: 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 10px; cursor: pointer; text-decoration: none; }
  .btn.cal { background: var(--blue-soft); border-color: transparent; }
  .btn.line { background: #06c755; color: #fff; border-color: transparent; }
  .st.on { background: var(--pink); color: #fff; border-color: var(--pink); }
  .add { background: var(--pink); color: #fff; border: none; font-weight: bold; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
  .tabs button { flex: 1 0 auto; font-size: 15px; padding: 8px 10px; white-space: nowrap; }
  .fav { margin-left: auto; background: none; border: none; font-size: 22px; line-height: 1; padding: 0 2px; color: var(--sub); }
  .fav.on { color: #f5b301; }
  .sortrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--sub); }
  .sortrow select { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  #list.slide-l { animation: slideL .2s ease-out; }
  #list.slide-r { animation: slideR .2s ease-out; }
  @keyframes slideL { from { transform: translateX(40px); opacity: .3; } }
  @keyframes slideR { from { transform: translateX(-40px); opacity: .3; } }
  .tabs button.on { background: var(--pink); color: #fff; border-color: var(--pink); font-weight: bold; }
  .src { font-size: 11px; color: var(--sub); margin-top: 8px; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  .demo { background: #fff3c4; color: #6b5a00; font-size: 12px; text-align: center; padding: 4px; }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 20; }
  #viewer img { max-width: 100%; max-height: 100%; }
  dialog { border: none; border-radius: 16px; width: min(560px, calc(100% - 24px)); background: var(--card); color: var(--ink); padding: 16px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog label { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
  dialog input, dialog textarea, dialog select { width: 100%; font: inherit; font-size: 15px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  dialog textarea { min-height: 70px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .msg { font-size: 13px; color: var(--sub); }
  /* 購入表 */
  .sortrow[hidden] { display: none; }
  .whobar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
  .whobar button { font-size: 15px; padding: 7px 16px; border-radius: 999px; }
  .whobar button.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: bold; }
  #sync { font-size: 11px; color: var(--sub); margin-left: 4px; }
  .shoprow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; color: var(--sub); }
  .shoprow select { font: inherit; font-size: 15px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  .shoprow a { margin-left: auto; color: var(--blue); text-decoration: none; white-space: nowrap; }
  .msec { font-size: 14px; font-weight: bold; color: var(--sub); margin: 18px 0 8px; }
  .mi { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; user-select: none; }
  .mi img, .mi .mimg { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; flex: 0 0 auto; background-color: var(--gray-soft); }
  .mi .nm { flex: 1; min-width: 0; font-size: 15px; line-height: 1.35; }
  .mi .nm small { display: block; font-size: 11px; color: var(--sub); }
  .mi .pr { font-size: 14px; white-space: nowrap; }
  .mi .ck { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
  .mi.on { border-color: var(--pink); background: var(--pink-soft); }
  .mi.on .ck { background: var(--pink); border-color: var(--pink); }
  .mi.off { opacity: .45; } .mi.off .nm { text-decoration: line-through; }
  .qty { display: flex; align-items: center; gap: 4px; }
  .qty button { width: 30px; height: 30px; padding: 0; font-size: 17px; }
  .qty b { min-width: 18px; text-align: center; }
  .total { position: sticky; top: var(--hdr, 0px); z-index: 4; background: var(--pink); color: #fff; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  .total .yen { font-size: 28px; font-weight: bold; }
  .total .cnt { font-size: 13px; }
  .total button { margin-left: auto; background: #fff; color: var(--pink); border: none; font-weight: bold; }
  .total button:disabled { opacity: .6; }
  main.wide { max-width: 1120px; }
  .mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 860px) { .mgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; } }
  .mi.pick { position: relative; display: block; padding: 0; overflow: hidden; margin: 0; }
  .mi.pick img, .mi.pick .mimg { display: block; width: 100%; height: auto; aspect-ratio: 1; border-radius: 0; cursor: zoom-in; }
  .mi.pick .ck { position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,.9); border-color: var(--sub); }
  .mi.pick.on .ck { background: var(--pink); }
  .mi.pick .nm { display: block; padding: 10px 10px 12px; font-weight: bold; }
  .mi .ds { display: block; font-size: 12px; font-weight: normal; color: var(--sub); line-height: 1.5; margin-top: 3px; }
  .mi .nt { display: block; font-size: 11px; font-weight: normal; color: var(--warn); margin-top: 3px; }
  .mi .ft { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; min-height: 30px; }
  .mi .ft .pr { font-size: 16px; font-weight: bold; }
  .mi .tax { font-size: 11px; font-weight: normal; color: var(--sub); }
  .mi.pick.wide2 { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (min-width: 860px) { .mi.pick.wide2 { grid-column: span 2; } }
  .artbox { grid-column: 1 / -1; padding: 0 10px 12px; }
  .artrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  @media (min-width: 860px) { .artrow { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
  .artk { grid-column: 1 / -1; font-size: 13px; font-weight: bold; color: var(--sub); }
  .art { display: inline-block; width: 56px; aspect-ratio: 1; border-radius: 50%; background-repeat: no-repeat; border: 2px solid transparent; flex: 0 0 auto; }
  .artrow .art { width: 100%; cursor: pointer; border: 3px solid var(--line); }
  .artrow .art.sel { border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink); }
  .arts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .art.none { font-size: 10px; font-weight: normal; color: var(--sub); border: 1px dashed var(--sub); display: inline-flex; align-items: center; justify-content: center; text-align: center; line-height: 1.2; }
  .orderlist .mi img, .orderlist .mi .mimg { width: 44px; height: 44px; }
  .orderlist .mi .nm { font-size: 18px; font-weight: bold; }
  .note { font-size: 11px; color: var(--sub); margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>
<div id="demo" class="demo" hidden>見本の表示です（実際の一覧はスプレッドシートから読み込みます）</div>
<header>
  <h1>ちいかわ予定帳 <button class="add" onclick="openAdd()">＋追加</button></h1>
  <nav class="tabs">
    <button data-view="event" onclick="setView('event')">🎪 ちいかわイベント</button>
    <button data-view="goods" onclick="setView('goods')">🛍️ ちいかわグッズ</button>
    <button data-view="arcade" onclick="setView('arcade')">🕹️ ちいかわゲーセン</button>
    <button data-view="gacha" onclick="setView('gacha')">🥚 ちいかわガチャ</button>
    <button data-view="interest" onclick="setView('interest')">👀 気になる</button>
    <button data-view="trend" onclick="setView('trend')">🔥 トレンド</button>
    <button data-view="fav" onclick="setView('fav')">⭐ お気に入り</button>
    <button data-view="order" onclick="setView('order')">🧾 購入表</button>
  </nav>
  <div class="sortrow">並べ方
    <select id="sort" onchange="setSort(this.value)">
      <option value="start">販売・受付の開始が近い順</option>
      <option value="newest">情報が新しい順</option>
      <option value="deadline">締め切りが近い順</option>
    </select>
    カレンダー
    <select id="calu" onchange="setCalU(this.value)">
      <option value="1">まみゅ</option>
      <option value="2">ばびゅ</option>
      <option value="mail">メールアドレスで指定…</option>
    </select>
  </div>
</header>
<main id="list"><p class="empty">読み込み中…</p></main>
<div id="viewer" onclick="this.style.display='none'"><img alt=""></div>

<dialog id="addDlg">
  <form id="addForm" method="dialog">
    <b>情報を追加</b>
    <label>タイトル *</label><input name="title" required placeholder="例：ちいかわレストラン 予約整理券（12月分）">
    <div class="two">
      <div><label>会場</label><input name="venue" placeholder="池袋PARCO"></div>
      <div><label>種別</label><select name="type"><option>抽選</option><option>先着</option><option>その他</option><option>グッズ抽選</option><option>グッズ先着</option><option>グッズ受注</option><option>グッズ新商品</option><option>ゲーセン</option><option>ガチャ</option><option>気になる抽選</option><option>気になる先着</option><option>気になるグッズ</option><option>気になるその他</option><option>トレンド抽選</option><option>トレンド先着</option><option>トレンドその他</option></select></div>
    </div>
    <div class="two">
      <div><label>販売・受付開始 *</label><input name="saleStart" type="datetime-local" required></div>
      <div><label>締め切り</label><input name="deadline" type="datetime-local"></div>
    </div>
    <label>対象期間</label><input name="period" placeholder="2026/12/26〜2027/1/31">
    <label>内容</label><textarea name="detail"></textarea>
    <label>リンク（1行に1つ。「グッズ https://…」のように前に名前を書けます）</label><textarea name="links"></textarea>
    <label>画像の URL（1行に1つ）</label><textarea name="imageUrls"></textarea>
    <label>画像ファイル（告知画像のスクショなど）</label><input name="files" type="file" accept="image/*" multiple>
    <label>情報元（X のポストの URL など）</label><input name="source">
    <div class="row"><button type="submit" class="add" id="addBtn">追加する</button><button type="button" onclick="addDlg.close()">やめる</button></div>
    <p class="msg" id="addMsg"></p>
  </form>
</dialog>

<script>
const STATUS_BTNS = ['応募済み', '見送り'];
let items = [];
// 種別の頭で一覧を分ける（スプレッドシートは1つのまま）
// 「グッズ〜」→ グッズ、「ゲーセン」→ ゲームセンターの景品、「ガチャ」→ カプセルトイ、「気になる〜」→ ちいかわ以外の気になるもの、「トレンド〜」→ 話題のもの、それ以外 → イベント
const viewOf = it => /^グッズ/.test(it.type || '') ? 'goods' : /^ゲーセン/.test(it.type || '') ? 'arcade' : /^ガチャ/.test(it.type || '') ? 'gacha' : /^気になる/.test(it.type || '') ? 'interest' : /^トレンド/.test(it.type || '') ? 'trend' : 'event';
const VIEWS = ['event', 'goods', 'arcade', 'gacha', 'interest', 'trend', 'fav', 'order'];

// お気に入りはこの端末だけに覚える（2人それぞれ別）
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('chiikawa-favs') || '[]')); } catch (e) {}
function toggleFav(id) {
  favs.has(id) ? favs.delete(id) : favs.add(id);
  try { localStorage.setItem('chiikawa-favs', JSON.stringify([...favs])); } catch (e) {}
  render();
}
let view = 'event';
try { const v = localStorage.getItem('chiikawa-view'); if (VIEWS.includes(v)) view = v; } catch (e) {}

function setView(v) {
  view = v;
  try { localStorage.setItem('chiikawa-view', v); } catch (e) {}
  render();
  if (v === 'order') pullOrder();
}

// スマホ：一覧を横にスワイプすると隣の切り替えへ（画像の横スクロールと切り替えのボタンの上では動かさない）
let touch0 = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touch0 = e.touches.length === 1 && !e.target.closest('.imgs, .tabs, dialog, input, textarea, select') ? { x: t.clientX, y: t.clientY } : null;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touch0) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y;
  touch0 = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const i = VIEWS.indexOf(view) + (dx < 0 ? 1 : -1);
  if (i < 0 || i >= VIEWS.length) return;
  setView(VIEWS[i]);
  window.scrollTo(0, 0);
  const on = document.querySelector('.tabs button.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  const list = document.getElementById('list');
  list.classList.remove('slide-l', 'slide-r');
  void list.offsetWidth;
  list.classList.add(dx < 0 ? 'slide-l' : 'slide-r');
}, { passive: true });

// 置き場所によって読み書きの方法を変える
// - Apps Script から開いたとき：google.script.run
// - Google の外（GitHub Pages など）に置いたとき：URL の #key= を合言葉にして、スクリプトの窓口（doPost）を呼ぶ
// - どちらでもないとき（手元の見本）：例のデータ
const API_URL = 'https://script.google.com/macros/s/AKfycbwP3oZCrGb73u2hdwKMLGH0ouRfoq7b5VsPf_1pdtZzjHcwh7ReRYFlsrRIhaxkEu7u/exec';
const IN_GAS = typeof google !== 'undefined' && google.script;
const APP_KEY = IN_GAS ? '<?= appKey ?>' : hashKey();
const DEMO = !IN_GAS && !APP_KEY;
const api = DEMO ? demoApi() : IN_GAS ? {
  call(name, ...args) {
    return new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[name](APP_KEY, ...args));
  }
} : {
  async call(name, ...args) {
    // text/plain にすると事前の確認（CORS のプリフライト）が起きず、Apps Script でも受け取れる
    const res = await fetch(API_URL, {
      method: 'POST',
      credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: APP_KEY, action: name, args }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    return json.data;
  }
};

// 合言葉は URL の # のあと（サーバーには送られない）。ホーム画面から開いたときのために端末にも覚えておく
function hashKey() {
  const m = location.hash.match(/key=([\w-]+)/);
  try {
    if (m) localStorage.setItem('chiikawa-key', m[1]);
    return m ? m[1] : localStorage.getItem('chiikawa-key') || '';
  } catch (e) {
    return m ? m[1] : '';
  }
}

// ホーム画面から開いたままでも、アプリに戻ったら一覧を読み直す（1分以内なら読み直さない）
let loadedAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (view === 'order') pullOrder();
  if (Date.now() - loadedAt > 60000) load();
});

function load() {
  loadedAt = Date.now();
  api.call('getItems').then(list => { items = list; render(); })
    .catch(e => { if (view !== 'order') document.getElementById('list').innerHTML = '<p class="empty">読み込めませんでした：' + esc(e.message || e) + '</p>'; });
}

function parseDate(s) {
  const m = String(s || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})(?:\D+(\d{1,2}):(\d{2}))?/);
  return m ? new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : null;
}
const WD = '日月火水木金土';
function fmt(s) {
  const d = parseDate(s);
  if (!d) return esc(s);
  const t = (d.getHours() || d.getMinutes()) ? ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0') : '';
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')' + t;
}
function daysLeft(s) {
  const d = parseDate(s);
  if (!d) return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  const n = Math.round((day - today) / 86400000);
  if (d < new Date()) return '';
  return n === 0 ? '今日！' : n === 1 ? '明日' : 'あと' + n + '日';
}
// 終わったもの＝締め切りを過ぎた、または対象期間が終わった。どちらもないものは終わりにしない
function isPast(it) {
  const now = new Date();
  const dl = parseDate(it.deadline);
  const pe = periodEnd(it.period, it.saleStart);
  return it.status === '終了' || !!(dl && dl < now) || !!(pe && pe < now);
}

// 対象期間「2026/11/21(土)〜12/25(金)」の終わりの日（その日の終わり）。年がなければ前の日付の年から決める
function periodEnd(p, saleStart) {
  if (!/[〜~～]/.test(p || '')) return null;
  const ds = periodDays(p, saleStart);
  if (ds.length < 2) return null;
  const e = ds[ds.length - 1];
  return new Date(e.getFullYear(), e.getMonth(), e.getDate(), 23, 59, 59);
}
// 対象期間に書かれた日付をすべて取り出す（「11:00〜21:00」のような時刻は日付に数えない）
function periodDays(p, saleStart) {
  let y = (parseDate(saleStart) || new Date()).getFullYear(), prevM = 0;
  return [...String(p || '').replace(/\d{1,2}:\d{2}/g, '').matchAll(/(?:(\d{4})[\/年-])?(\d{1,2})[\/月](\d{1,2})/g)].map(m => {
    if (m[1]) y = +m[1]; else if (+m[2] < prevM) y++;
    prevM = +m[2];
    return new Date(y, m[2] - 1, +m[3]);
  });
}
// 開催中／開催前。対象期間が日付で始まるイベントだけ（お届け・発送・発売の予定には出さない）。終わったものは「終了」に任せる
function holdState(it) {
  if (/グッズ|ゲーセン|ガチャ/.test(it.type) || !/^\s*\d{4}\D\d{1,2}\D\d{1,2}/.test(it.period || '') || isPast(it)) return null;
  const ds = periodDays(it.period, it.saleStart);
  const start = parseDate(it.period), last = ds[ds.length - 1];
  const md = d => (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - today) / 86400000);
  if (start > new Date()) {
    const n = days(start);
    return { cls: 'pre', label: '開催前', note: md(start) + (n === 0 ? ' 今日から' : n === 1 ? ' 明日から' : 'から・あと' + n + '日') };
  }
  const n = days(last);
  if (n < 0) return null;
  return { cls: 'now', label: '開催中', note: n === 0 ? '今日まで' : md(last) + 'まで・あと' + n + '日' };
}

function calUrl(it, which) {
  const s = which === 'deadline' ? it.deadline : it.saleStart;
  const d = parseDate(s);
  const p = n => String(n).padStart(2, '0');
  const f = x => x.getFullYear() + p(x.getMonth() + 1) + p(x.getDate()) + 'T' + p(x.getHours()) + p(x.getMinutes()) + '00';
  const end = new Date(d.getTime() + 60 * 60000); // 1時間（カレンダーで題名が読める長さ）
  const label = which === 'deadline' ? '【締切】' : (/抽選/.test(it.type) ? '【抽選受付開始】' : /先着/.test(it.type) ? '【先着販売開始】' : it.type === 'グッズ受注' ? '【受注開始】' : /グッズ新商品|気になるグッズ|ガチャ/.test(it.type) ? '【発売】' : it.type === 'ゲーセン' ? '【登場】' : '【開始】');
  const details = [it.period && '対象期間：' + it.period, it.detail, ...(it.links || [])].filter(Boolean).join('\n');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&authuser=' + encodeURIComponent(calU)
    + '&text=' + encodeURIComponent(label + it.title)
    + '&dates=' + f(d) + '/' + f(end) + '&ctz=Asia/Tokyo'
    + '&details=' + encodeURIComponent(details)
    + '&location=' + encodeURIComponent(it.venue || '');
}

// LINE で送る文。アプリの URL（合言葉つき）は入れない
function lineUrl(it) {
  const text = [it.title,
    it.saleStart && "開始：" + fmt(it.saleStart),
    it.deadline && "締め切り：" + fmt(it.deadline),
    it.period && "対象期間：" + it.period,
    ...(it.links || [])].filter(Boolean).join("\n");
  return "https://line.me/R/share?text=" + encodeURIComponent(text);
}

// 値がないものは後ろ
const asc = (x, y) => x === y ? 0 : x === null ? 1 : y === null ? -1 : x - y;
const SORTS = {
  start: (a, b) => asc(time(a.saleStart), time(b.saleStart)),
  newest: (a, b) => { const x = time(a.createdAt), y = time(b.createdAt); return x === y ? 0 : x === null ? 1 : y === null ? -1 : y - x; },
  deadline: (a, b) => asc(time(a.deadline), time(b.deadline)) || asc(time(a.saleStart), time(b.saleStart)),
};

    .sort((a, b) => (later(a) - later(b)) || (SORTS[sortBy] || SORTS.start)(a, b));

  el.innerHTML = list.map(card).join('');
}

// 内容欄を読みやすく：先頭の料金・手帳・付き添い／要確認／話題／案内／開館・休館 のまとまりごとに1行あける
function detailBlocks(s) {
  let prev = null, head = true;
  return String(s).split('\n').filter(l => l.trim()).map(l => {
    head = head && /^(料金|障害者手帳割引|付き添い)：/.test(l);
    const g = head ? 'head' : /^【要確認】/.test(l) ? 'check' : /^(なぜ話題か|話題の理由|話題)[：:]/.test(l) ? 'topic'
      : /休館|^開館|^締め切りは/.test(l) ? 'hours' : 'body';
    const out = (prev && g !== prev ? '\n' : '') + l;
    prev = g;
    return out;
  }).join('\n');
}

function card(it) {
  const typeCls = /抽選/.test(it.type) ? 'lottery' : /先着/.test(it.type) ? 'first' : '';
  const imgs = it.images.length ? '<div class="imgs">' + it.images.map(u =>

  const left = daysLeft(it.saleStart);
  const leftDl = daysLeft(it.deadline);
  const statusBadge = (isPast(it) ? '<span class="badge end">終了</span>' : '') + (it.status === '応募済み' ? '<span class="badge done">✓ 応募済み</span>'
    : it.status === '見送り' ? '<span class="badge">見送り</span>'
    : it.status === '新着' && !isPast(it) ? '<span class="badge new">NEW</span>' : '');
  const applied = it.status === '応募済み';
  const hold = holdState(it);
  const startLabel = it.type === 'グッズ新商品' || it.type === 'ガチャ' ? '発売' : it.type === 'ゲーセン' ? '登場' : /抽選|先着|受注/.test(it.type) ? '受付開始' : '開始';
  return '<article class="card' + (isPast(it) || it.status === '見送り' ? ' past' : '') + (applied ? ' applied' : '') + '">'
    + (applied ? '<div class="appliedbar">✓ 応募済み</div>' : '') + imgs + '<div class="body">'
    + '<div class="badges">' + statusBadge
    + (it.type ? '<span class="badge ' + typeCls + '">' + esc(it.type.replace(/^(気になる|トレンド)/, '')) + '</span>' : '')
    + (it.venue ? '<span class="badge">' + esc(it.venue) + '</span>' : '')
    + '<button class="fav' + (favs.has(it.id) ? ' on' : '') + '" title="お気に入り" onclick="toggleFav(\'' + it.id + '\')">' + (favs.has(it.id) ? '★' : '☆') + '</button></div>'
    + (hold ? '<div class="hold ' + hold.cls + '"><b>' + hold.label + '</b><span>' + hold.note + '</span></div>' : '')
    + '<div class="title">' + esc(it.title) + '</div>'
    + '<dl class="when">'
    + (it.saleStart ? '<dt>' + startLabel + '</dt><dd><span class="big">' + fmt(it.saleStart) + '</span>' + (left ? '<span class="left">' + left + '</span>' : '') + '</dd>'
      : isPast(it) ? '' : '<dt>' + startLabel + '</dt><dd><span class="big">' + (it.type === 'グッズ新商品' || it.type === 'ガチャ' ? '発売日未定' : it.type === 'ゲーセン' ? '登場日未定' : '開始日未定') + '</span></dd>')
    + (it.deadline ? '<dt>締め切り</dt><dd>' + fmt(it.deadline) + (leftDl ? '<span class="left">' + leftDl + '</span>' : '') + '</dd>' : '')
    + (it.period ? '<dt>' + (hold ? '開催期間' : '対象期間') + '</dt><dd>' + esc(it.period) + '</dd>' : '')
    + '</dl>'
    + (it.detail ? '<p class="detail">' + esc(detailBlocks(it.detail)) + '</p>' : '')
    + '<div class="links">' + it.links.map(linkHtml).join('') + '</div>'
    + '<div class="row">'
    + (parseDate(it.saleStart) ? '<a class="btn cal" target="_blank" href="' + esc(calUrl(it, 'start')) + '">📅 開始をカレンダーへ</a>' : '')
    + (parseDate(it.deadline) ? '<a class="btn cal" target="_blank" href="' + esc(calUrl(it, 'deadline')) + '">📅 締め切りをカレンダーへ</a>' : '')
    + '<a class="btn line" target="_blank" href="' + esc(lineUrl(it)) + '">LINE で送る</a>'
    + '</div><div class="row">'
    + STATUS_BTNS.map(s => '<button class="st' + (it.status === s ? ' on' : '') + '" onclick="setStatus(\'' + it.id + '\',\'' + s + '\')">' + (it.status === s ? '✓ ' : '') + s + '</button>').join('')
    + '</div>'
    + (it.source ? '<div class="src">情報元：' + esc(it.source) + '</div>' : '')
    + '</div></article>';
}

const LINK_ICONS = [['予約', '🎫'], ['抽選', '🎫'], ['チケット', '🎫'], ['グッズ', '🛍️'], ['メニュー', '🍽️'], ['アクセス', '🗺️'], ['公式', '🐹']];
function linkHtml(line) {
  const m = line.match(/^(.*?)\s*(https?:\/\/\S+)$/);
  if (!m) return '';
  const label = m[1].replace(/[：:｜|]\s*$/, '').trim();
  const icon = label && (LINK_ICONS.find(([w]) => label.includes(w)) || [, '🔗'])[1];
  const text = label ? icon + ' ' + label + ' ↗' : linkName(m[2]);
  return '<a href="' + esc(m[2]) + '" target="_blank" rel="noopener">' + esc(text) + '</a>';
}

function linkName(u) {
  if (u.includes('l-tike.com')) return '🎫 ローチケのページ ↗';
  if (u.includes('parco.jp')) return '🏬 PARCO のページ ↗';
  if (u.includes('x.com') || u.includes('twitter.com')) return '🐦 X のポスト ↗';
  if (u.includes('chiikawa')) return '🐹 ちいかわ公式 ↗';
  return u.replace(/^https?:\/\//, '').slice(0, 40) + ' ↗';
}

      [15, '郎パン', 2380, 'パン', '『ちいかわ』に登場する「郎」で提供されるラーメンをイメージした食事系パン', 'スーベニアどんぶり付き'],
      [16, 'カブトムシワッフル', 480, 'パン', 'ほんのりはちみつ風味とアーモンドプラリネの食感がおいしいカブトムシのワッフル', 'ちいかわベーカリー(東京)限定'],
      [17, 'くりまんじゅうパン', 480, 'パン', '栗あんのつまった食べ応えのある食感のくりまんじゅうパン'],
      [47, '報酬袋焼き', 590, 'パン', '中にあんバター（報酬）が入ってる！報酬袋焼き'],
      [48, 'くまさんポシェットパン', 590, 'パン', 'フランボワーズソースがはいったメロンパン風ポシェットパン'],
      [91, 'ランチボックス（S）', 770, 'スーベニア', 'パンカウンターにてパンを購入されるお客様のみご購入いただけます。', 'パン1つご購入につき1点まで・食パンは対象外'],
      [97, 'ランチボックス（M）', 1540, 'スーベニア', 'パンカウンターにてパンを購入されるお客様のみご購入いただけます。', 'パン1つご購入につき1点まで・食パンは対象外'],
      [95, 'パンプキンスープ', 790, 'ドリンク', '', '期間限定・10/2（金）〜なくなり次第終了'],
      [76, 'ドリンクボトル（ちいかわ）', 1500, 'ドリンク'],
      [77, 'ドリンクボトル（ハチワレ）', 1500, 'ドリンク'],
      [78, 'ドリンクボトル（うさぎ）', 1500, 'ドリンク'],
      [28, 'アイスコーヒー', 590, 'ドリンク'],
      [29, 'アイスティー', 590, 'ドリンク'],
      [30, 'アイスカフェラテ', 690, 'ドリンク'],
      [70, 'ホットカフェラテ', 690, 'ドリンク', 'ラテアート7種からお好きな絵柄をお選びいただけます。'],
      [61, 'ホットコーヒー/ホットティー', 590, 'ドリンク'],
    ].map(([n, name, price, sec, desc, note, crop]) => ({ id: 'b' + n, img: crop ? SANTA.img : BK + String(n).padStart(2, '0') + '.jpg', name, price, sec, desc: desc || '', note: note || '', crop })),
    // ホットカフェラテのラテアート：公式の写真（1000×667）の上に並ぶ7つの丸を切り抜いて出す
    arts: { b70: { img: BK + '70.jpg', w: 1000, h: 667, d: 120, cy: 79, cx: [77, 218, 359, 500, 641, 781, 937] } },
  },
};
// 購入表は人ごと（まみゅ・ばびゅ）に分けて、端末とスクリプト（ORDER_<who>）の両方に保存する。
// 別の端末で開いても、新しいほう（at が大きいほう）を使う
const WHO = { mamyu: 'まみゅ', babyu: 'ばびゅ' };
let who = 'mamyu';
try { who = localStorage.getItem('chiikawa-order-who') || (calU === '2' ? 'babyu' : 'mamyu'); } catch (e) {}
if (!WHO[who]) who = 'mamyu';
let order, orderStep = 'pick', sync = '';
try { orderStep = localStorage.getItem('chiikawa-order-step') || 'pick'; } catch (e) {}
function readLocalOrder() {
  order = { shop: 'bakery', qty: {}, art: {}, at: 0 };
  try {
    const old = localStorage.getItem('chiikawa-order'); // 人ごとに分ける前の保存はまみゅの分にする
    if (old && !localStorage.getItem('chiikawa-order-mamyu')) localStorage.setItem('chiikawa-order-mamyu', old);
    localStorage.removeItem('chiikawa-order');
    const o = JSON.parse(localStorage.getItem('chiikawa-order-' + who) || '{}');
    order = Object.assign(order, { shop: o.shop || 'bakery', qty: o.qty || {}, art: o.art || {}, at: o.at || 0 });
  } catch (e) {}
}
readLocalOrder();
let shown = null; // 注文の画面に出している品（そこで ✅ を外しても行は残し、押し直せるようにする）
const orderJson = () => JSON.stringify({ shop: order.shop, qty: order.qty, art: order.art, at: order.at });
const putTimers = {};
function saveOrder() {
  order.at = Date.now();
  try { localStorage.setItem('chiikawa-order-' + who, orderJson()); } catch (e) {}
  putOrderSoon();
}
function putOrderSoon() {
  if (DEMO) return;
  // 送るのはこの時点の中身（すぐに人を切り替えても、それぞれの分が正しく届く）
  const w = who, json = orderJson();
  clearTimeout(putTimers[w]);
  sync = 'saving';
  putTimers[w] = setTimeout(() => {
    api.call('putOrder', w, json).then(() => { if (w === who) sync = 'saved'; }, () => { if (w === who) sync = 'local'; }).then(syncLabel);
  }, 800);
}
// スクリプトに保存されたほうが新しければ、そちらを出す
function pullOrder() {
  if (DEMO) return;
  const w = who;
  api.call('getOrder', w).then(json => {
    if (w !== who) return;
    sync = 'saved';
    const o = json ? JSON.parse(json) : null;
    if (o && (o.at || 0) > (order.at || 0)) {
      order = { shop: o.shop || 'bakery', qty: o.qty || {}, art: o.art || {}, at: o.at };
      try { localStorage.setItem('chiikawa-order-' + who, orderJson()); } catch (e) {}
      shown = null;
      if (view === 'order') renderOrder();
    } else if (o ? order.at > (o.at || 0) : Object.keys(order.qty).length) { // 端末のほうが新しければ送り直す
      order.at = order.at || Date.now(); // 時刻のない古い保存にも時刻を付けて、ほかの端末で新しいと分かるようにする
      putOrderSoon();
    }
    syncLabel();
  }).catch(() => { sync = 'local'; syncLabel(); });
}
function syncLabel() {
  const el = document.getElementById('sync');
  if (el) el.textContent = { saving: '保存中…', saved: '☁ 保存済み（ほかの端末でも出せます）', local: 'この端末だけに保存中（スクリプトの更新が必要）' }[DEMO ? '' : sync] || '';
}
function setWho(w) {
  who = w;
  try { localStorage.setItem('chiikawa-order-who', w); } catch (e) {}
  readLocalOrder(); shown = null; sync = '';
  renderOrder(); pullOrder();
}
const shopMenu = () => (SHOPS[order.shop] || SHOPS.bakery).menu;
const yen = n => '¥' + n.toLocaleString('ja-JP');

function toggleItem(id) { order.qty[id] ? delete order.qty[id] : order.qty[id] = 1; saveOrder(); renderOrder(); }
function addQty(id, d, ev) {
  ev.stopPropagation();
  const n = (order.qty[id] || 0) + d;
  n > 0 ? order.qty[id] = n : delete order.qty[id];
  saveOrder(); renderOrder();
}
function setStep(step) {
  orderStep = step;
  shown = null;
  try { localStorage.setItem('chiikawa-order-step', step); } catch (e) {}
  window.scrollTo(0, 0); renderOrder();
}
function setShop(v) { order.shop = v; order.qty = {}; order.art = {}; saveOrder(); setStep('pick'); }
function clearOrder() { if (confirm(WHO[who] + 'の ✅ をすべて外しますか？')) { order.qty = {}; order.art = {}; saveOrder(); setStep('pick'); } }
// k 杯目の絵柄を i にする（同じものをもう一度押すと選び直し）
function setArt(id, k, i, ev) {
  ev.stopPropagation();
  const a = order.art[id] = order.art[id] || [];
  a[k] = a[k] === i ? null : i;
  saveOrder(); renderOrder();
}
// 写真の i 番目の丸を切り抜く（大きさは CSS で決める。割合で指定するので、どの大きさでも同じ所が出る）
function artDot(art, i, cls, click) {
  return '<span class="art' + (cls ? ' ' + cls : '') + '"' + (click ? ' onclick="' + click + '"' : '') + ' style="'
    + 'background-image:url(\'' + art.img + '\');background-size:' + (art.w / art.d * 100).toFixed(1) + '% ' + (art.h / art.d * 100).toFixed(1) + '%;'
    + 'background-position:' + ((art.cx[i] - art.d / 2) / (art.w - art.d) * 100).toFixed(2) + '% ' + ((art.cy - art.d / 2) / (art.h - art.d) * 100).toFixed(2) + '%"></span>';
}

function renderOrder() {
  document.documentElement.style.setProperty('--hdr', document.querySelector('header').offsetHeight + 'px');
  const shop = SHOPS[order.shop] || SHOPS.bakery, menu = shop.menu;
  const picked = menu.filter(m => order.qty[m.id]);
  const sum = picked.reduce((a, m) => a + m.price * order.qty[m.id], 0);
  const cnt = picked.reduce((a, m) => a + order.qty[m.id], 0);
  const img = m => m.crop
    ? '<span class="mimg" onclick="event.stopPropagation();zoom(\'' + esc(m.img) + '\')" style="cursor:zoom-in;background-image:url(\'' + esc(m.img) + '\');'
      + 'background-size:' + (SANTA.w / SANTA.d * 100).toFixed(1) + '% ' + (SANTA.h / SANTA.d * 100).toFixed(1) + '%;'
      + 'background-position:' + ((m.crop[0] - SANTA.d / 2) / (SANTA.w - SANTA.d) * 100).toFixed(2) + '% ' + ((m.crop[1] - SANTA.d / 2) / (SANTA.h - SANTA.d) * 100).toFixed(2) + '%"></span>'
    : '<img src="' + esc(m.img) + '" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="this.style.visibility=\'hidden\'"'
    + ' onclick="event.stopPropagation();zoom(this.src)">';
  // 注文の画面：小さい画像・名前・値段。ラテアートは選んだ絵柄を並べる
  const row = (m, big) => {
    const q = order.qty[m.id] || 0, art = (shop.arts || {})[m.id];
    if (big) {
      const chosen = art ? (order.art[m.id] || []).slice(0, q) : [];
      return '<div class="mi' + (q ? ' on' : ' off') + '" onclick="toggleItem(\'' + m.id + '\')">'
        + '<div class="ck">' + (q ? '✓' : '') + '</div>' + img(m)
        + '<div class="nm">' + esc(m.name)
        + (art && q ? '<span class="arts">' + Array.from({ length: q }, (_, k) => chosen[k] != null ? artDot(art, chosen[k]) : '<span class="art none">絵柄<br>未定</span>').join('') + '</span>' : '')
        + '</div>'
        + '<div class="pr">' + (q > 1 ? '×' + q + ' ' : '') + yen(m.price * (q || 1)) + '</div></div>';
    }
    // メニューの画面：大きい画像・公式の説明・税込の値段
    // ラテアートは ✅ を付けるとカードを横に広げて、絵柄を大きく並べる
    const arts = art && q ? '<div class="artbox">' + Array.from({ length: q }, (_, k) => '<div class="artrow"><span class="artk">' + (q > 1 ? (k + 1) + '杯目の絵柄' : '絵柄を選ぶ') + '</span>'
      + art.cx.map((_, i) => artDot(art, i, (order.art[m.id] || [])[k] === i ? 'sel' : '', 'setArt(\'' + m.id + '\',' + k + ',' + i + ',event)')).join('') + '</div>').join('') + '</div>' : '';
    return '<div class="mi pick' + (q ? ' on' : '') + (arts ? ' wide2' : '') + '" onclick="toggleItem(\'' + m.id + '\')">'
      + '<div class="ck">' + (q ? '✓' : '') + '</div>' + img(m)
      + '<div class="nm">' + esc(m.name)
      + (m.desc ? '<span class="ds">' + esc(m.desc) + '</span>' : '')
      + (m.note ? '<span class="nt">※' + esc(m.note) + '</span>' : '')
      + '<div class="ft"><span class="pr">' + yen(m.price) + '<span class="tax">（税込）</span></span>'
      + (q ? '<span class="qty"><button onclick="addQty(\'' + m.id + '\',-1,event)">−</button><b>' + q + '</b><button onclick="addQty(\'' + m.id + '\',1,event)">＋</button></span>' : '')
      + '</div></div>' + arts + '</div>';
  };
  const el = document.getElementById('list');
  // だれの購入表か（まみゅ・ばびゅで別々に保存）
  const whoBar = '<div class="whobar">' + Object.keys(WHO).map(k => '<button class="' + (k === who ? 'on' : '') + '" onclick="setWho(\'' + k + '\')">' + WHO[k] + '</button>').join('')
    + '<span id="sync"></span></div>';
  el.classList.toggle('wide', orderStep !== 'list'); // メニューは横に広く（パソコン4列・スマホ2列）、注文画面は縦1列
  if (orderStep === 'list') {
    if (!shown) shown = picked.map(m => m.id);
    const rows = menu.filter(m => shown.includes(m.id));
    el.innerHTML = whoBar + '<div class="total"><span class="yen">' + yen(sum) + '</span><span class="cnt">' + cnt + '点（税込）</span><button onclick="setStep(\'pick\')">‹ メニューへ</button></div>'
      + '<div class="orderlist">' + (rows.length ? rows.map(m => row(m, true)).join('') : '<p class="empty">✅ を付けたものはありません</p>') + '</div>'
      + '<div class="row"><button onclick="clearOrder()">✅ をすべて外す</button></div>';
    syncLabel();
    return;
  }
  el.innerHTML = whoBar + '<div class="shoprow">お店 <select onchange="setShop(this.value)">'
      + Object.keys(SHOPS).map(k => '<option value="' + k + '"' + (k === order.shop ? ' selected' : '') + '>' + esc(SHOPS[k].name) + '</option>').join('')
      + '</select><a href="' + esc(shop.url) + '" target="_blank" rel="noopener">公式メニュー</a></div>'
    + '<div class="total"><span class="yen">' + yen(sum) + '</span><span class="cnt">' + cnt + '点（税込）</span><button onclick="setStep(\'list\')"' + (cnt ? '' : ' disabled') + '>注文画面へ ›</button></div>'
    + [...new Set(menu.map(m => m.sec))].map(s => '<div class="msec">' + esc(s) + '</div><div class="mgrid">'
      + menu.filter(m => m.sec === s).map(m => row(m, false)).join('') + '</div>').join('')
    + '<p class="note">値段は税込（公式メニュー ' + esc(shop.checked) + ' 確認）。品切れや値段が変わることがあるので、お店で確かめてください。</p>';
  syncLabel();
}

load();
if (view === 'order') pullOrder();
</script>
</body>
</html>
