<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ちいかわ予定帳</title>
<style>
  :root {
    --bg: #fff8f3; --card: #ffffff; --ink: #4a3b36; --sub: #8a7a73; --line: #f0e2da;
    --pink: #f29bb0; --pink-soft: #fde6ec; --blue: #7cb7e8; --blue-soft: #e4f1fb;
    --green: #8cc9a0; --green-soft: #e5f4ea; --gray-soft: #f1ece9; --past: #d6cfcb; --past-ink: #5f534e; --warn: #e2725b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #221c1a; --card: #2e2624; --ink: #f3e9e4; --sub: #b8a9a2; --line: #433834;
      --pink-soft: #4a2c35; --blue-soft: #233a4d; --green-soft: #26402f; --gray-soft: #3a312e; --past: #171211; --past-ink: #a3958f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 22px; margin: 0; display: flex; align-items: center; gap: 8px; }
  h1 .add { margin-left: auto; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 80px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 14px; overflow: hidden; }
  .card.past { background: var(--past); border-color: transparent; }
  .card.past .imgs { filter: grayscale(.9) brightness(.8); opacity: .75; }
  .card.past { color: var(--past-ink); } .card.past .title, .card.past .big { color: var(--past-ink); }
  .badge.end { background: #6f6460; color: #fff; }
  .imgs { display: flex; gap: 6px; overflow-x: auto; background: var(--gray-soft); }
  .imgs img { height: 180px; max-width: 100%; object-fit: cover; cursor: zoom-in; flex: 0 0 auto; }
  .imgs img:only-child { width: 100%; height: auto; max-height: 280px; }
  .body { padding: 12px 14px 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--gray-soft); }
  .badge.new { background: var(--pink); color: #fff; font-weight: bold; }
  .badge.lottery { background: var(--blue-soft); }
  .badge.first { background: var(--pink-soft); }
  .badge.done { background: var(--green-soft); }
  .title { font-size: 21px; font-weight: bold; margin: 14px 0 10px; line-height: 1.45; }
  .when { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 14px; margin-bottom: 8px; align-items: baseline; }
  .when dt { color: var(--sub); }
  .when dd { margin: 0; }
  .big { font-size: 18px; font-weight: bold; }
  .left { color: var(--warn); font-weight: bold; margin-left: 6px; font-size: 13px; }
  .detail { font-size: 13px; color: var(--sub); white-space: pre-wrap; line-height: 1.6; margin: 0 0 8px; }
  .links { margin: 18px 0; }
  .links a { display: block; font-size: 14px; color: var(--blue); word-break: break-all; margin: 8px 0; text-decoration: none; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  button, .btn { font: inherit; font-size: 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 10px; cursor: pointer; text-decoration: none; }
  .btn.cal { background: var(--blue-soft); border-color: transparent; }
  .btn.line { background: #06c755; color: #fff; border-color: transparent; }
  .st.on { background: var(--pink); color: #fff; border-color: var(--pink); }
  .add { background: var(--pink); color: #fff; border: none; font-weight: bold; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
  .tabs button { flex: 1 0 auto; font-size: 15px; padding: 8px 10px; white-space: nowrap; }
  .fav { margin-left: auto; background: none; border: none; font-size: 22px; line-height: 1; padding: 0 2px; color: var(--sub); }
  .fav.on { color: #f5b301; }
  .sortrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--sub); }
  .sortrow select { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  #list.slide-l { animation: slideL .2s ease-out; }
  #list.slide-r { animation: slideR .2s ease-out; }
  @keyframes slideL { from { transform: translateX(40px); opacity: .3; } }
  @keyframes slideR { from { transform: translateX(-40px); opacity: .3; } }
  .tabs button.on { background: var(--pink); color: #fff; border-color: var(--pink); font-weight: bold; }
  .src { font-size: 11px; color: var(--sub); margin-top: 8px; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  .demo { background: #fff3c4; color: #6b5a00; font-size: 12px; text-align: center; padding: 4px; }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 20; }
  #viewer img { max-width: 100%; max-height: 100%; }
  dialog { border: none; border-radius: 16px; width: min(560px, calc(100% - 24px)); background: var(--card); color: var(--ink); padding: 16px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog label { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
  dialog input, dialog textarea, dialog select { width: 100%; font: inherit; font-size: 15px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  dialog textarea { min-height: 70px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .msg { font-size: 13px; color: var(--sub); }
</style>
</head>
<body>
<div id="demo" class="demo" hidden>見本の表示です（実際の一覧はスプレッドシートから読み込みます）</div>
<header>
  <h1>ちいかわ予定帳 <button class="add" onclick="openAdd()">＋追加</button></h1>
  <nav class="tabs">
    <button data-view="event" onclick="setView('event')">🎪 イベント</button>
    <button data-view="goods" onclick="setView('goods')">🛍️ グッズ</button>
    <button data-view="interest" onclick="setView('interest')">👀 気になる</button>
    <button data-view="trend" onclick="setView('trend')">🔥 トレンド</button>
    <button data-view="fav" onclick="setView('fav')">⭐ お気に入り</button>
  </nav>
  <div class="sortrow">並べ方
    <select id="sort" onchange="setSort(this.value)">
      <option value="start">販売・受付の開始が近い順</option>
      <option value="newest">情報が新しい順</option>
      <option value="deadline">締め切りが近い順</option>
    </select>
    カレンダー
    <select id="calu" onchange="setCalU(this.value)">
      <option value="0">1つ目のアカウント</option>
      <option value="1">2つ目のアカウント</option>
      <option value="2">3つ目のアカウント</option>
      <option value="mail">メールアドレスで指定…</option>
    </select>
  </div>
</header>
<main id="list"><p class="empty">読み込み中…</p></main>
<div id="viewer" onclick="this.style.display='none'"><img alt=""></div>

<dialog id="addDlg">
  <form id="addForm" method="dialog">
    <b>情報を追加</b>
    <label>タイトル *</label><input name="title" required placeholder="例：ちいかわレストラン 予約整理券（12月分）">
    <div class="two">
      <div><label>会場</label><input name="venue" placeholder="池袋PARCO"></div>
      <div><label>種別</label><select name="type"><option>抽選</option><option>先着</option><option>その他</option><option>グッズ抽選</option><option>グッズ先着</option><option>グッズ受注</option><option>グッズ新商品</option><option>気になる抽選</option><option>気になる先着</option><option>気になるグッズ</option><option>気になるその他</option><option>トレンド抽選</option><option>トレンド先着</option><option>トレンドその他</option></select></div>
    </div>
    <div class="two">
      <div><label>販売・受付開始 *</label><input name="saleStart" type="datetime-local" required></div>
      <div><label>締め切り</label><input name="deadline" type="datetime-local"></div>
    </div>
    <label>対象期間</label><input name="period" placeholder="2026/12/26〜2027/1/31">
    <label>内容</label><textarea name="detail"></textarea>
    <label>リンク（1行に1つ。「グッズ https://…」のように前に名前を書けます）</label><textarea name="links"></textarea>
    <label>画像の URL（1行に1つ）</label><textarea name="imageUrls"></textarea>
    <label>画像ファイル（告知画像のスクショなど）</label><input name="files" type="file" accept="image/*" multiple>
    <label>情報元（X のポストの URL など）</label><input name="source">
    <div class="row"><button type="submit" class="add" id="addBtn">追加する</button><button type="button" onclick="addDlg.close()">やめる</button></div>
    <p class="msg" id="addMsg"></p>
  </form>
</dialog>

<script>
const STATUS_BTNS = ['応募済み', '見送り'];
let items = [];
// 種別の頭で一覧を分ける（スプレッドシートは1つのまま）
// 「グッズ〜」→ グッズ、「気になる〜」→ ちいかわ以外の気になるもの、「トレンド〜」→ 話題のもの、それ以外 → イベント
const viewOf = it => /^グッズ/.test(it.type || '') ? 'goods' : /^気になる/.test(it.type || '') ? 'interest' : /^トレンド/.test(it.type || '') ? 'trend' : 'event';
const VIEWS = ['event', 'goods', 'interest', 'trend', 'fav'];

// お気に入りはこの端末だけに覚える（2人それぞれ別）
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('chiikawa-favs') || '[]')); } catch (e) {}
function toggleFav(id) {
  favs.has(id) ? favs.delete(id) : favs.add(id);
  try { localStorage.setItem('chiikawa-favs', JSON.stringify([...favs])); } catch (e) {}
  render();
}
let view = 'event';
try { const v = localStorage.getItem('chiikawa-view'); if (VIEWS.includes(v)) view = v; } catch (e) {}

function setView(v) {
  view = v;
  try { localStorage.setItem('chiikawa-view', v); } catch (e) {}
  render();
}

// スマホ：一覧を横にスワイプすると隣の切り替えへ（画像の横スクロールと切り替えのボタンの上では動かさない）
let touch0 = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touch0 = e.touches.length === 1 && !e.target.closest('.imgs, .tabs, dialog, input, textarea, select') ? { x: t.clientX, y: t.clientY } : null;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touch0) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y;
  touch0 = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const i = VIEWS.indexOf(view) + (dx < 0 ? 1 : -1);
  if (i < 0 || i >= VIEWS.length) return;
  setView(VIEWS[i]);
  window.scrollTo(0, 0);
  const on = document.querySelector('.tabs button.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  const list = document.getElementById('list');
  list.classList.remove('slide-l', 'slide-r');
  void list.offsetWidth;
  list.classList.add(dx < 0 ? 'slide-l' : 'slide-r');
}, { passive: true });

// 置き場所によって読み書きの方法を変える
// - Apps Script から開いたとき：google.script.run
// - Google の外（GitHub Pages など）に置いたとき：URL の #key= を合言葉にして、スクリプトの窓口（doPost）を呼ぶ
// - どちらでもないとき（手元の見本）：例のデータ
const API_URL = 'https://script.google.com/macros/s/AKfycbwP3oZCrGb73u2hdwKMLGH0ouRfoq7b5VsPf_1pdtZzjHcwh7ReRYFlsrRIhaxkEu7u/exec';
const IN_GAS = typeof google !== 'undefined' && google.script;
const APP_KEY = IN_GAS ? '<?= appKey ?>' : hashKey();
const DEMO = !IN_GAS && !APP_KEY;
const api = DEMO ? demoApi() : IN_GAS ? {
  call(name, ...args) {
    return new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[name](APP_KEY, ...args));
  }
} : {
  async call(name, ...args) {
    // text/plain にすると事前の確認（CORS のプリフライト）が起きず、Apps Script でも受け取れる
    const res = await fetch(API_URL, {
      method: 'POST',
      credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: APP_KEY, action: name, args }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    return json.data;
  }
};

// 合言葉は URL の # のあと（サーバーには送られない）。ホーム画面から開いたときのために端末にも覚えておく
function hashKey() {
  const m = location.hash.match(/key=([\w-]+)/);
  try {
    if (m) localStorage.setItem('chiikawa-key', m[1]);
    return m ? m[1] : localStorage.getItem('chiikawa-key') || '';
  } catch (e) {
    return m ? m[1] : '';
  }
}

function load() {
  api.call('getItems').then(list => { items = list; render(); })
    .catch(e => { document.getElementById('list').innerHTML = '<p class="empty">読み込めませんでした：' + esc(e.message || e) + '</p>'; });
}

function parseDate(s) {
  const m = String(s || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})(?:\D+(\d{1,2}):(\d{2}))?/);
  return m ? new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : null;
}
const WD = '日月火水木金土';
function fmt(s) {
  const d = parseDate(s);
  if (!d) return esc(s);
  const t = (d.getHours() || d.getMinutes()) ? ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0') : '';
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')' + t;
}
function daysLeft(s) {
  const d = parseDate(s);
  if (!d) return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  const n = Math.round((day - today) / 86400000);
  if (d < new Date()) return '';
  return n === 0 ? '今日！' : n === 1 ? '明日' : 'あと' + n + '日';
}
// 終わったもの＝締め切りを過ぎた、または対象期間が終わった。どちらもないものは終わりにしない
function isPast(it) {
  const now = new Date();
  const dl = parseDate(it.deadline);
  const pe = periodEnd(it.period, it.saleStart);
  return it.status === '終了' || !!(dl && dl < now) || !!(pe && pe < now);
}

// 対象期間「2026/11/21(土)〜12/25(金)」の終わりの日（その日の終わり）。年がなければ前の日付の年から決める
function periodEnd(p, saleStart) {
  const parts = String(p || '').split(/[〜~～]/);
  if (parts.length < 2) return null;
  const startY = (parts[0].match(/(\d{4})\D/) || [])[1] || (parseDate(saleStart) || new Date()).getFullYear();
  const startM = +((parts[0].match(/(?:\d{4}\D)?(\d{1,2})\D(\d{1,2})/) || [])[1] || 0);
  const m = parts[parts.length - 1].match(/(?:(\d{4})\D)?(\d{1,2})\D(\d{1,2})/);
  if (!m) return null;
  const y = m[1] ? +m[1] : +startY + (+m[2] < startM ? 1 : 0);
  return new Date(y, m[2] - 1, +m[3], 23, 59, 59);
}

function calUrl(it, which) {
  const s = which === 'deadline' ? it.deadline : it.saleStart;
  const d = parseDate(s);
  const p = n => String(n).padStart(2, '0');
  const f = x => x.getFullYear() + p(x.getMonth() + 1) + p(x.getDate()) + 'T' + p(x.getHours()) + p(x.getMinutes()) + '00';
  const end = new Date(d.getTime() + 60 * 60000); // 1時間（カレンダーで題名が読める長さ）
  const label = which === 'deadline' ? '【締切】' : (/抽選/.test(it.type) ? '【抽選受付開始】' : /先着/.test(it.type) ? '【先着販売開始】' : it.type === 'グッズ受注' ? '【受注開始】' : /グッズ新商品|気になるグッズ/.test(it.type) ? '【発売】' : '【開始】');
  const details = [it.period && '対象期間：' + it.period, it.detail, ...(it.links || [])].filter(Boolean).join('\n');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&authuser=' + encodeURIComponent(calU)
    + '&text=' + encodeURIComponent(label + it.title)
    + '&dates=' + f(d) + '/' + f(end) + '&ctz=Asia/Tokyo'
    + '&details=' + encodeURIComponent(details)
    + '&location=' + encodeURIComponent(it.venue || '');
}

// LINE で送る文。アプリの URL（合言葉つき）は入れない
function lineUrl(it) {
  const text = [it.title,
    it.saleStart && "開始：" + fmt(it.saleStart),
    it.deadline && "締め切り：" + fmt(it.deadline),
    it.period && "対象期間：" + it.period,
    ...(it.links || [])].filter(Boolean).join("\n");
  return "https://line.me/R/share?text=" + encodeURIComponent(text);
}

// 並べ方（この端末に覚える）。どの並べ方でも、終わったもの・見送ったものは下へ
let sortBy = 'start';
try { sortBy = localStorage.getItem('chiikawa-sort') || 'start'; } catch (e) {}
function setSort(v) {
  sortBy = v;
  try { localStorage.setItem('chiikawa-sort', v); } catch (e) {}
  render();
}
// カレンダーを開く Google アカウント（ログイン順の番号かメールアドレス。この端末だけに覚える）
let calU = '0';
try { calU = localStorage.getItem('chiikawa-cal-u') || '0'; } catch (e) {}
function setCalU(v) {
  if (v === 'mail') {
    const m = (prompt('カレンダーを開く Google アカウントのメールアドレス', /@/.test(calU) ? calU : '') || '').trim();
    if (!/^[^@\s]+@[^@\s]+$/.test(m)) { render(); return; }
    v = m;
  }
  calU = v;
  try { localStorage.setItem('chiikawa-cal-u', v); } catch (e) {}
  render();
}
const time = s => { const d = parseDate(s); return d ? d.getTime() : null; };
// 値がないものは後ろ
const asc = (x, y) => x === y ? 0 : x === null ? 1 : y === null ? -1 : x - y;
const SORTS = {
  start: (a, b) => asc(time(a.saleStart), time(b.saleStart)),
  newest: (a, b) => { const x = time(a.createdAt), y = time(b.createdAt); return x === y ? 0 : x === null ? 1 : y === null ? -1 : y - x; },
  deadline: (a, b) => asc(time(a.deadline), time(b.deadline)) || asc(time(a.saleStart), time(b.saleStart)),
};

// 1つの一覧に全部並べる
function render() {
  const later = it => isPast(it) || it.status === '見送り';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  document.getElementById('sort').value = sortBy;
  const cs = document.getElementById('calu');
  let mo = cs.querySelector('option.mailset');
  if (/@/.test(calU)) {
    if (!mo) { mo = document.createElement('option'); mo.className = 'mailset'; cs.insertBefore(mo, cs.lastElementChild); }
    mo.value = mo.textContent = calU;
  } else if (mo) mo.remove();
  cs.value = calU;
  const list = items.filter(it => view === 'fav' ? favs.has(it.id) : viewOf(it) === view)
    .sort((a, b) => (later(a) - later(b)) || (SORTS[sortBy] || SORTS.start)(a, b));
  const el = document.getElementById('list');
  if (!list.length) { el.innerHTML = '<p class="empty">' + ({ goods: 'グッズの情報はまだありません', interest: '気になる情報はまだありません', trend: 'トレンドの情報はまだありません', fav: '☆ を押したものがここに集まります' }[view] || 'まだ何もありません') + '</p>'; return; }
  el.innerHTML = list.map(card).join('');
}

function card(it) {
  const typeCls = /抽選/.test(it.type) ? 'lottery' : /先着/.test(it.type) ? 'first' : '';
  const imgs = it.images.length ? '<div class="imgs">' + it.images.map(u =>
    '<img src="' + esc(u) + '" loading="lazy" referrerpolicy="no-referrer" onclick="zoom(this.src)" onerror="this.remove()" alt="">').join('') + '</div>' : '';
  const left = daysLeft(it.saleStart);
  const leftDl = daysLeft(it.deadline);
  const statusBadge = (isPast(it) ? '<span class="badge end">終了</span>' : '') + (it.status === '応募済み' ? '<span class="badge done">✓ 応募済み</span>'
    : it.status === '見送り' ? '<span class="badge">見送り</span>'
    : it.status === '新着' && !isPast(it) ? '<span class="badge new">NEW</span>' : '');
  return '<article class="card' + (isPast(it) || it.status === '見送り' ? ' past' : '') + '">' + imgs + '<div class="body">'
    + '<div class="badges">' + statusBadge
    + (it.type ? '<span class="badge ' + typeCls + '">' + esc(it.type.replace(/^(気になる|トレンド)/, '')) + '</span>' : '')
    + (it.venue ? '<span class="badge">' + esc(it.venue) + '</span>' : '')
    + '<button class="fav' + (favs.has(it.id) ? ' on' : '') + '" title="お気に入り" onclick="toggleFav(\'' + it.id + '\')">' + (favs.has(it.id) ? '★' : '☆') + '</button></div>'
    + '<div class="title">' + esc(it.title) + '</div>'
    + '<dl class="when">'
    + '<dt>' + (it.type === 'グッズ新商品' ? '発売' : '開始') + '</dt><dd><span class="big">' + fmt(it.saleStart) + '</span>' + (left ? '<span class="left">' + left + '</span>' : '') + '</dd>'
    + (it.deadline ? '<dt>締め切り</dt><dd>' + fmt(it.deadline) + (leftDl ? '<span class="left">' + leftDl + '</span>' : '') + '</dd>' : '')
    + (it.period ? '<dt>対象期間</dt><dd>' + esc(it.period) + '</dd>' : '')
    + '</dl>'
    + (it.detail ? '<p class="detail">' + esc(it.detail) + '</p>' : '')
    + '<div class="links">' + it.links.map(linkHtml).join('') + '</div>'
    + '<div class="row">'
    + (parseDate(it.saleStart) ? '<a class="btn cal" target="_blank" href="' + esc(calUrl(it, 'start')) + '">📅 開始をカレンダーへ</a>' : '')
    + (parseDate(it.deadline) ? '<a class="btn cal" target="_blank" href="' + esc(calUrl(it, 'deadline')) + '">📅 締め切りをカレンダーへ</a>' : '')
    + '<a class="btn line" target="_blank" href="' + esc(lineUrl(it)) + '">LINE で送る</a>'
    + '</div><div class="row">'
    + STATUS_BTNS.map(s => '<button class="st' + (it.status === s ? ' on' : '') + '" onclick="setStatus(\'' + it.id + '\',\'' + s + '\')">' + (it.status === s ? '✓ ' : '') + s + '</button>').join('')
    + '</div>'
    + (it.source ? '<div class="src">情報元：' + esc(it.source) + '</div>' : '')
    + '</div></article>';
}

// リンクの行は「メニュー https://…」のように、URL の前に名前を書いてもよい
const LINK_ICONS = [['予約', '🎫'], ['抽選', '🎫'], ['チケット', '🎫'], ['グッズ', '🛍️'], ['メニュー', '🍽️'], ['アクセス', '🗺️'], ['公式', '🐹']];
function linkHtml(line) {
  const m = line.match(/^(.*?)\s*(https?:\/\/\S+)$/);
  if (!m) return '';
  const label = m[1].replace(/[：:｜|]\s*$/, '').trim();
  const icon = label && (LINK_ICONS.find(([w]) => label.includes(w)) || [, '🔗'])[1];
  const text = label ? icon + ' ' + label + ' ↗' : linkName(m[2]);
  return '<a href="' + esc(m[2]) + '" target="_blank" rel="noopener">' + esc(text) + '</a>';
}

function linkName(u) {
  if (u.includes('l-tike.com')) return '🎫 ローチケのページ ↗';
  if (u.includes('parco.jp')) return '🏬 PARCO のページ ↗';
  if (u.includes('x.com') || u.includes('twitter.com')) return '🐦 X のポスト ↗';
  if (u.includes('chiikawa')) return '🐹 ちいかわ公式 ↗';
  return u.replace(/^https?:\/\//, '').slice(0, 40) + ' ↗';
}

function setStatus(id, s) {
  const it = items.find(x => x.id === id);
  const next = it.status === s ? '新着' : s;
  it.status = next; render();
  api.call('setStatus', id, next).catch(e => { alert('保存できませんでした：' + (e.message || e)); load(); });
}

function zoom(src) {
  const v = document.getElementById('viewer');
  v.querySelector('img').src = src;
  v.style.display = 'flex';
}

function openAdd() {
  document.getElementById('addMsg').textContent = '';
  document.querySelector('#addForm [name=type]').value = ({ goods: 'グッズ抽選', interest: '気になる抽選', trend: 'トレンドその他' }[view] || '抽選');
  addDlg.showModal();
}

document.getElementById('addForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target;
  const data = Object.fromEntries(new FormData(f).entries());
  delete data.files;
  const files = await Promise.all([...f.files.files].map(file => new Promise(ok => {
    const r = new FileReader();
    r.onload = () => ok({ name: file.name, type: file.type, data: r.result.split(',')[1] });
    r.readAsDataURL(file);
  })));
  document.getElementById('addBtn').disabled = true;
  document.getElementById('addMsg').textContent = '保存しています…';
  api.call('addItem', data, files).then(() => {
    f.reset(); addDlg.close(); load();
  }).catch(e => {
    document.getElementById('addMsg').textContent = '保存できませんでした：' + (e.message || e);
  }).finally(() => { document.getElementById('addBtn').disabled = false; });
});

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
